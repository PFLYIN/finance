<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0a0e" />
  <meta name="description" content="FINANCE — controle financeiro pessoal com visual dark inspirado em julgamento e pecado." />
  <title>FINANCE</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="bg-glow glow-gold"></div>
  <div class="bg-glow glow-red"></div>

  <div class="container app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">✦</div>
        <div>
          <div class="brand-name">FINANCE</div>
          <div class="brand-tag">SIN // EXPENSES</div>
        </div>
      </div>
      <button class="btn btn-ghost" id="newMonthBtn" type="button">+ Novo mês</button>
    </header>

    <section class="page-header">
      <div class="logo">✦</div>
      <p class="eyebrow">EVERY EXPENSE LEAVES A MARK</p>
      <h1>FINANCE</h1>
      <p class="subtitle">SIN // EXPENSES</p>
    </section>

    <section class="card month-panel">
      <div class="section-head">
        <h2>Meses</h2>
      </div>
      <div class="months" id="monthsList"></div>
    </section>

    <section class="summary-grid" id="summaryCards"></section>

    <div class="grid two-columns main-grid">
      <section class="card">
        <div class="section-head">
          <h2>Adicionar transação</h2>
          <span class="pill" id="currentMonthLabel">—</span>
        </div>

        <form id="expenseForm" class="transaction-form">
          <div class="field-group two-up">
            <label class="field">
              <span>Nome</span>
              <input type="text" id="expenseName" placeholder="Ex.: Mercado" required />
            </label>
            <label class="field">
              <span>Valor</span>
              <input type="number" id="expenseValue" min="0.01" step="0.01" placeholder="0,00" required />
            </label>
          </div>

          <div class="field-group two-up">
            <label class="field">
              <span>Categoria</span>
              <select id="expenseCategory">
                <option value="food">🍔 Alimentação</option>
                <option value="transport">🚗 Transporte</option>
                <option value="leisure">🎮 Lazer</option>
                <option value="studies">📚 Estudos</option>
                <option value="bills">💳 Contas</option>
                <option value="shopping">🛒 Compras</option>
                <option value="other">💰 Outros</option>
              </select>
            </label>
            <label class="field">
              <span>Tipo</span>
              <select id="expenseType">
                <option value="expense">Gasto</option>
                <option value="income">Entrada</option>
              </select>
            </label>
          </div>

          <div class="field-group two-up">
            <label class="field">
              <span>Data</span>
              <input type="date" id="expenseDate" required />
            </label>
            <label class="field">
              <span>Observação</span>
              <input type="text" id="expenseNote" placeholder="Opcional" />
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Registrar</button>
            <button type="reset" class="btn btn-secondary" id="resetFormBtn">Limpar</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>Orçamento</h2>
        </div>

        <div class="budget-box">
          <div class="budget-row">
            <span>Limite mensal</span>
            <strong id="budgetValue">R$ 0,00</strong>
          </div>
          <div class="budget-progress">
            <span id="budgetProgress"></span>
          </div>
          <div class="budget-meta">
            <span id="budgetRemaining">Restante: R$ 0,00</span>
            <span id="budgetUsage">0% usado</span>
          </div>

          <div class="budget-edit">
            <input type="number" id="budgetInput" min="0" step="0.01" placeholder="Defina o limite" />
            <button type="button" class="btn btn-primary" id="saveBudgetBtn">Salvar</button>
          </div>
        </div>
      </section>
    </div>

    <div class="grid two-columns lower-grid">
      <section class="card">
        <div class="section-head">
          <h2>Transações</h2>
          <button type="button" class="btn btn-ghost small" id="clearMonthBtn">Limpar mês</button>
        </div>
        <ul id="transactionsList" class="transaction-list"></ul>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>Distribuição</h2>
        </div>
        <div id="categoryChart" class="chart-list"></div>
      </section>
    </div>

    <section class="card comparison-panel">
      <div class="section-head">
        <h2>Comparativo</h2>
      </div>
      <div id="monthComparison" class="comparison-box"></div>
    </section>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/months.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
